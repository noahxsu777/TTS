<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MP3 Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.11/dist/ffmpeg.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07070f;--bg2:#0d0d1a;--surface:#12121f;--surface2:#1a1a2e;--surface3:#22223a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --purple:#8b5cf6;--purple-dim:rgba(139,92,246,0.15);--purple-glow:rgba(139,92,246,0.35);
  --green:#10b981;--green-dim:rgba(16,185,129,0.15);
  --red:#ef4444;--red-dim:rgba(239,68,68,0.1);
  --orange:#f59e0b;--orange-dim:rgba(245,158,11,0.12);
  --blue:#3b82f6;--cyan:#06b6d4;
  --text:#f0f0ff;--text2:rgba(240,240,255,0.65);--text3:rgba(240,240,255,0.35);--text4:rgba(240,240,255,0.15);
  --radius:14px;--radius-lg:20px;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
body{padding:0;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}

/* Background */
.bg-canvas{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.bg-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.12;}
.bg-blob-1{width:600px;height:500px;background:radial-gradient(circle,#7c3aed,transparent);top:-100px;left:-100px;animation:drift 18s ease-in-out infinite alternate;}
.bg-blob-2{width:500px;height:400px;background:radial-gradient(circle,#06b6d4,transparent);top:30%;right:-80px;animation:drift 22s ease-in-out infinite alternate-reverse;}
.bg-blob-3{width:400px;height:350px;background:radial-gradient(circle,#10b981,transparent);bottom:-50px;left:40%;animation:drift 15s ease-in-out infinite alternate;}
@keyframes drift{0%{transform:translate(0,0) scale(1);}100%{transform:translate(30px,20px) scale(1.05);}}

/* Layout */
.app{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:0 16px 80px;}

/* Header */
.header{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
  padding:28px 0 24px;border-bottom:1px solid var(--border);margin-bottom:28px;
}
.header-logo{display:flex;align-items:center;gap:14px;}
.logo-icon{
  width:48px;height:48px;border-radius:16px;
  background:linear-gradient(135deg,#7c3aed,#4f46e5,#06b6d4);
  display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;
  box-shadow:0 0 24px rgba(139,92,246,0.4);
}
.logo-text{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.logo-sub{font-size:12px;color:var(--text3);margin-top:2px;font-weight:400;}
.header-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.quality-label{font-size:12px;font-weight:600;color:var(--text3);}
.quality-btns{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;}
.q-btn{
  padding:6px 14px;border-radius:8px;border:none;background:transparent;
  color:var(--text3);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s;
}
.q-btn.active{background:var(--purple);color:#fff;box-shadow:0 2px 8px rgba(139,92,246,0.4);}

/* Status bar */
.status-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:13px;
}
.status-bar.loading{border-color:rgba(139,92,246,0.3);}
.status-bar.ready{border-color:rgba(16,185,129,0.3);}
.status-bar.error-bar{border-color:rgba(239,68,68,0.3);}
.status-spinner{
  width:18px;height:18px;border:2px solid rgba(139,92,246,0.2);
  border-top-color:var(--purple);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg);}}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.status-dot.green{background:var(--green);box-shadow:0 0 6px var(--green);}
.status-dot.red{background:var(--red);}

/* Drop zone */
.drop-zone{
  border:2px dashed rgba(139,92,246,0.3);border-radius:var(--radius-lg);
  background:var(--surface);padding:48px 24px;text-align:center;
  cursor:pointer;transition:all 0.2s;margin-bottom:20px;
}
.drop-zone:hover,.drop-zone.drag-over{
  border-color:var(--purple);background:var(--purple-dim);
}
.drop-icon{font-size:48px;margin-bottom:16px;line-height:1;}
.drop-title{font-size:18px;font-weight:700;margin-bottom:8px;}
.drop-sub{font-size:13px;color:var(--text3);margin-bottom:20px;line-height:1.5;}
.drop-formats{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:22px;
}
.fmt-badge{
  padding:4px 10px;border-radius:6px;border:1px solid var(--border2);
  font-size:11px;font-weight:700;color:var(--text3);background:var(--surface2);
}
.btn-select{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 28px;border-radius:12px;border:none;
  background:var(--purple);color:#fff;font-size:14px;font-weight:700;
  cursor:pointer;transition:all 0.2s;
  box-shadow:0 4px 16px rgba(139,92,246,0.35);
}
.btn-select:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(139,92,246,0.45);}

/* Actions bar */
.actions-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:20px;
}
.actions-bar.hidden{display:none;}
.btn-action{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 20px;border-radius:10px;border:none;
  font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s;
}
.btn-convert-all{background:var(--purple);color:#fff;box-shadow:0 2px 10px rgba(139,92,246,0.35);}
.btn-convert-all:hover{opacity:0.88;}
.btn-convert-all:disabled{opacity:0.4;cursor:not-allowed;}
.btn-download-all{background:var(--green);color:#fff;box-shadow:0 2px 10px rgba(16,185,129,0.3);}
.btn-download-all:hover{opacity:0.88;}
.btn-download-all:disabled{opacity:0.35;cursor:not-allowed;}
.btn-clear-all{background:var(--surface2);border:1px solid var(--border2);color:var(--text2);}
.btn-clear-all:hover{background:var(--surface3);}
.progress-summary{margin-left:auto;font-size:12px;color:var(--text3);font-weight:600;}

/* File list */
.file-list{display:flex;flex-direction:column;gap:10px;}
.file-item{
  display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;transition:border-color 0.2s;
}
.file-item.converting{border-color:rgba(139,92,246,0.4);}
.file-item.done{border-color:rgba(16,185,129,0.3);}
.file-item.error{border-color:rgba(239,68,68,0.3);}
.file-ico{
  width:40px;height:40px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.file-ico.video{background:rgba(59,130,246,0.15);}
.file-ico.audio{background:rgba(139,92,246,0.15);}
.file-ico.done-ico{background:rgba(16,185,129,0.15);}
.file-body{flex:1;min-width:0;}
.file-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-meta{font-size:11px;color:var(--text3);margin-top:3px;}
.file-progress-wrap{margin-top:8px;}
.prog-bar-bg{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;}
.prog-bar-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:2px;transition:width 0.3s;}
.prog-label{font-size:11px;color:var(--text3);margin-top:4px;}
.file-done-label{font-size:12px;color:var(--green);margin-top:4px;font-weight:600;}
.file-err-label{font-size:12px;color:var(--red);margin-top:4px;}
.file-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.badge{
  padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;
}
.badge-wait{background:var(--surface2);color:var(--text3);}
.badge-conv{background:var(--purple-dim);color:var(--purple);}
.badge-done{background:var(--green-dim);color:var(--green);}
.badge-err{background:var(--red-dim);color:var(--red);}
.btn-dl{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:8px;border:none;
  background:var(--green);color:#fff;font-size:12px;font-weight:700;
  cursor:pointer;transition:opacity 0.15s;
}
.btn-dl:hover{opacity:0.85;}
.btn-retry{
  padding:7px 12px;border-radius:8px;border:1px solid var(--border2);
  background:var(--surface2);color:var(--text2);font-size:12px;font-weight:600;
  cursor:pointer;
}
.btn-remove{
  width:28px;height:28px;border-radius:7px;border:none;
  background:var(--surface2);color:var(--text3);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;
}
.btn-remove:hover{background:var(--red-dim);color:var(--red);}

/* Upload button */
.btn-upload{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:8px;border:1px solid rgba(96,165,250,0.3);
  background:rgba(59,130,246,0.12);color:#60a5fa;font-size:12px;font-weight:700;
  cursor:pointer;transition:opacity 0.15s;
}
.btn-upload:hover:not(:disabled){opacity:0.8;}
.btn-upload:disabled{opacity:0.45;cursor:not-allowed;}
.btn-upload-all{background:rgba(59,130,246,0.12);color:#60a5fa;border:1px solid rgba(96,165,250,0.3);}
.btn-upload-all:hover:not(:disabled){opacity:0.85;}
.btn-upload-all:disabled{opacity:0.35;cursor:not-allowed;}

/* Permanent URL row */
.url-row{
  display:flex;align-items:center;gap:6px;margin-top:6px;
  background:var(--surface2);border:1px solid rgba(6,182,212,0.25);border-radius:8px;
  padding:5px 10px;
}
.url-text{
  font-size:11px;color:var(--cyan);font-family:monospace;letter-spacing:0.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;
}
.btn-copy{
  padding:3px 9px;border-radius:5px;border:none;
  background:var(--surface3);color:var(--text3);font-size:11px;font-weight:600;
  cursor:pointer;flex-shrink:0;transition:color 0.15s;
}
.btn-copy:hover{color:var(--text);}

/* Empty state */
.empty-hint{text-align:center;color:var(--text4);font-size:13px;padding:40px 0;display:none;}

/* Toast */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1e1e35;border:1px solid var(--border2);border-radius:12px;
  padding:12px 22px;font-size:13px;font-weight:600;color:var(--text);
  opacity:0;transition:all 0.3s;pointer-events:none;z-index:999;white-space:nowrap;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:600px){
  .header{flex-direction:column;align-items:flex-start;}
  .file-item{flex-wrap:wrap;}
  .file-right{width:100%;justify-content:flex-end;}
  .btn-select{width:100%;}
}
</style>
</head>
<body>

<div class="bg-canvas">
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
</div>

<div class="app">

  <!-- Header -->
  <div class="header">
    <div class="header-logo">
      <div class="logo-icon">🎵</div>
      <div>
        <div class="logo-text">MP3 Converter</div>
        <div class="logo-sub">Convierte video y audio a MP3 — todo en el navegador</div>
      </div>
    </div>
    <div class="header-controls">
      <span class="quality-label">Calidad:</span>
      <div class="quality-btns">
        <button class="q-btn" data-q="128k" onclick="setQuality('128k')">128k</button>
        <button class="q-btn active" data-q="192k" onclick="setQuality('192k')">192k</button>
        <button class="q-btn" data-q="320k" onclick="setQuality('320k')">320k</button>
      </div>
    </div>
  </div>

  <!-- FFmpeg status -->
  <div class="status-bar loading" id="status-bar">
    <div class="status-spinner" id="status-spinner"></div>
    <span id="status-text">Cargando motor de conversión…</span>
  </div>

  <!-- Drop zone -->
  <div class="drop-zone" id="drop-zone" onclick="triggerPick(event)">
    <div class="drop-icon">🎬</div>
    <div class="drop-title">Arrastra tus archivos aquí</div>
    <div class="drop-sub">o haz clic para seleccionar — múltiples archivos a la vez</div>
    <div class="drop-formats">
      <span class="fmt-badge">MP4</span><span class="fmt-badge">MPEG</span>
      <span class="fmt-badge">MKV</span><span class="fmt-badge">AVI</span>
      <span class="fmt-badge">MOV</span><span class="fmt-badge">WebM</span>
      <span class="fmt-badge">M4A</span><span class="fmt-badge">AAC</span>
      <span class="fmt-badge">OGG</span><span class="fmt-badge">FLAC</span>
      <span class="fmt-badge">WAV</span><span class="fmt-badge">WMA</span>
    </div>
    <button class="btn-select" onclick="event.stopPropagation();document.getElementById('file-input').click()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Seleccionar archivos
    </button>
    <input type="file" id="file-input" multiple
      accept=".mp4,.mpeg,.mpg,.m4v,.mkv,.avi,.mov,.webm,.m4a,.aac,.ogg,.flac,.wav,.wma,video/*,audio/*"
      style="display:none" onchange="handleFilePick(this.files)"/>
  </div>

  <!-- Actions -->
  <div class="actions-bar hidden" id="actions-bar">
    <button class="btn-action btn-convert-all" id="btn-convert-all" onclick="convertAll()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Convertir todo
    </button>
    <button class="btn-action btn-download-all" id="btn-download-all" disabled onclick="downloadAll()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Descargar todo (ZIP)
    </button>
    <button class="btn-action btn-upload-all" id="btn-upload-all" disabled onclick="uploadAll()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>
      Subir al servidor
    </button>
    <button class="btn-action btn-clear-all" onclick="clearAll()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      Limpiar
    </button>
    <span class="progress-summary" id="progress-summary"></span>
  </div>

  <!-- File list -->
  <div class="file-list" id="file-list"></div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let ffmpegInst = null;
let ffmpegReady = false;
let ffmpegLoading = false;
let activeConvert = false;
let selectedQuality = '192k';

let files = [];        // { id, file, name, baseName, ext, status, progress, blob }
// status: 'waiting' | 'converting' | 'done' | 'error'

// ── FFmpeg load ───────────────────────────────────────────────────────────────
async function initFFmpeg() {
  if (ffmpegReady || ffmpegLoading) return;
  ffmpegLoading = true;
  setStatus('loading', 'Cargando motor de conversión FFmpeg…');
  try {
    const { createFFmpeg } = FFmpeg;
    ffmpegInst = createFFmpeg({
      log: false,
      corePath: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
      progress: ({ ratio }) => {
        const converting = files.find(f => f.status === 'converting');
        if (converting) {
          converting.progress = Math.min(99, Math.round(ratio * 100));
          updateFileUI(converting);
        }
      },
    });
    await ffmpegInst.load();
    ffmpegReady = true;
    setStatus('ready', 'Motor listo — selecciona archivos para convertir');
  } catch (e) {
    setStatus('error', 'Error cargando FFmpeg: ' + (e?.message || 'revisa tu conexión'));
  } finally {
    ffmpegLoading = false;
  }
}

function setStatus(type, msg) {
  const bar = document.getElementById('status-bar');
  const spin = document.getElementById('status-spinner');
  const txt = document.getElementById('status-text');
  bar.className = 'status-bar ' + (type === 'loading' ? 'loading' : type === 'ready' ? 'ready' : 'error-bar');
  spin.style.display = type === 'loading' ? '' : 'none';

  if (type !== 'loading') {
    const dot = document.createElement('div');
    dot.className = 'status-dot ' + (type === 'ready' ? 'green' : 'red');
    if (!bar.querySelector('.status-dot')) bar.insertBefore(dot, txt);
    else bar.querySelector('.status-dot').className = 'status-dot ' + (type === 'ready' ? 'green' : 'red');
  }
  txt.textContent = msg;
}

// ── Quality ───────────────────────────────────────────────────────────────────
function setQuality(q) {
  selectedQuality = q;
  document.querySelectorAll('.q-btn').forEach(b => b.classList.toggle('active', b.dataset.q === q));
}

// ── File pick / drop ──────────────────────────────────────────────────────────
function triggerPick(e) {
  if (e.target.closest('button')) return;
  document.getElementById('file-input').click();
}

function handleFilePick(fileList) {
  if (!fileList?.length) return;
  addFiles([...fileList]);
  document.getElementById('file-input').value = '';
}

const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const items = [...(e.dataTransfer.items || [])];
  const dropped = items.map(i => i.getAsFile()).filter(Boolean);
  if (dropped.length) addFiles(dropped);
  else if (e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]);
});

// Also accept paste
document.addEventListener('paste', e => {
  const items = [...(e.clipboardData.files || [])];
  if (items.length) addFiles(items);
});

// ── Add files ─────────────────────────────────────────────────────────────────
function addFiles(fileList) {
  const supported = /\.(mp4|mpeg|mpg|m4v|mkv|avi|mov|webm|m4a|aac|ogg|flac|wav|wma|ts|3gp|rmvb|asf|vob)$/i;
  let added = 0;
  for (const f of fileList) {
    if (!supported.test(f.name) && !f.type.startsWith('video/') && !f.type.startsWith('audio/')) {
      showToast('⚠️ ' + f.name + ' — formato no soportado');
      continue;
    }
    const baseName = f.name.replace(/\.[^.]+$/, '');
    const ext = (f.name.match(/\.([^.]+)$/) || ['',''])[1].toLowerCase();
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2);
    files.push({ id, file: f, name: f.name, baseName, ext, status: 'waiting', progress: 0, blob: null, uploadUrl: null, uploading: false });
    added++;
  }
  if (added) {
    renderList();
    showActions();
    updateSummary();
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
const AUDIO_EXTS = new Set(['m4a','aac','ogg','flac','wav','wma','mp3']);
function isAudio(ext) { return AUDIO_EXTS.has(ext); }

function fileIcon(ext) {
  if (ext === 'mp3') return '🎵';
  if (isAudio(ext)) return '🎧';
  return '🎬';
}
function iconClass(f) { return f.status === 'done' ? 'done-ico' : isAudio(f.ext) ? 'audio' : 'video'; }

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderList() {
  const list = document.getElementById('file-list');
  if (!files.length) { list.innerHTML = ''; return; }
  list.innerHTML = files.map(f => {
    const ico = f.status === 'done' ? '✅' : f.status === 'error' ? '❌' : fileIcon(f.ext);
    const icoClass = iconClass(f);
    return `
    <div class="file-item ${f.status}" id="item-${f.id}">
      <div class="file-ico ${icoClass}">${ico}</div>
      <div class="file-body">
        <div class="file-name" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="file-meta">${formatSize(f.file.size)} · ${f.ext.toUpperCase() || '?'} → MP3</div>
        ${f.status === 'converting' ? `
          <div class="file-progress-wrap">
            <div class="prog-bar-bg"><div class="prog-bar-fill" id="bar-${f.id}" style="width:${f.progress}%"></div></div>
            <div class="prog-label" id="pct-${f.id}">${f.progress}%</div>
          </div>` : ''}
        ${f.status === 'done' ? `<div class="file-done-label">✅ ${esc(f.baseName)}.mp3</div>` : ''}
        ${f.status === 'error' ? `<div class="file-err-label">❌ Error al convertir</div>` : ''}
        ${f.uploadUrl ? `<div class="url-row"><span class="url-text" title="${esc(location.origin + f.uploadUrl)}">${esc(location.origin + f.uploadUrl)}</span><button class="btn-copy" onclick="copyUrl('${esc(location.origin + f.uploadUrl)}')">📋 Copiar</button></div>` : ''}
      </div>
      <div class="file-right">
        ${f.status === 'waiting' ? `<span class="badge badge-wait">Esperando</span>` : ''}
        ${f.status === 'converting' ? `<span class="badge badge-conv">Convirtiendo…</span>` : ''}
        ${f.status === 'done' ? `<button class="btn-dl" onclick="downloadFile('${f.id}')">⬇ Descargar</button>` : ''}
        ${f.status === 'done' ? `<button class="btn-upload" onclick="uploadFile('${f.id}')" ${f.uploading ? 'disabled' : ''}>${f.uploading ? '⏳ Subiendo…' : f.uploadUrl ? '✅ Subido' : '☁ Subir'}</button>` : ''}
        ${f.status === 'error' ? `<button class="btn-retry" onclick="retryFile('${f.id}')">↩ Reintentar</button>` : ''}
        ${f.status !== 'converting' ? `<button class="btn-remove" onclick="removeFile('${f.id}')" title="Eliminar">×</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function updateFileUI(f) {
  const item = document.getElementById('item-' + f.id);
  if (!item) return;
  // Only update progress parts to avoid full re-render flicker
  const bar = document.getElementById('bar-' + f.id);
  const pct = document.getElementById('pct-' + f.id);
  if (bar) bar.style.width = f.progress + '%';
  if (pct) pct.textContent = f.progress + '%';
}

function showActions() {
  document.getElementById('actions-bar').classList.remove('hidden');
}
function hideActions() {
  if (!files.length) document.getElementById('actions-bar').classList.add('hidden');
}

function updateSummary() {
  const done = files.filter(f => f.status === 'done').length;
  const total = files.length;
  const s = document.getElementById('progress-summary');
  s.textContent = total ? `${done} / ${total} listas` : '';
  document.getElementById('btn-download-all').disabled = done === 0;
  document.getElementById('btn-upload-all').disabled = done === 0;
}

// ── Conversion ────────────────────────────────────────────────────────────────
async function convertAll() {
  if (!ffmpegReady) { showToast('⏳ FFmpeg aún cargando, espera un momento'); return; }
  if (activeConvert) { showToast('⏳ Ya hay una conversión en progreso'); return; }

  const waiting = files.filter(f => f.status === 'waiting' || f.status === 'error');
  if (!waiting.length) { showToast('✅ Todos los archivos ya están convertidos'); return; }

  document.getElementById('btn-convert-all').disabled = true;
  activeConvert = true;

  for (const f of waiting) {
    await convertFile(f);
    updateSummary();
  }

  activeConvert = false;
  document.getElementById('btn-convert-all').disabled = false;
  const done = files.filter(f => f.status === 'done').length;
  showToast(`✅ ${done} archivo${done !== 1 ? 's' : ''} convertido${done !== 1 ? 's' : ''}`);
}

async function convertFile(f) {
  f.status = 'converting';
  f.progress = 0;
  renderList();

  try {
    const { fetchFile } = FFmpeg;
    const inputName = 'in.' + f.ext;
    const outputName = 'out.mp3';

    ffmpegInst.FS('writeFile', inputName, await fetchFile(f.file));

    await ffmpegInst.run(
      '-i', inputName,
      '-vn',                     // no video
      '-ar', '44100',            // sample rate
      '-ac', '2',                // stereo
      '-b:a', selectedQuality,   // bitrate
      '-f', 'mp3',
      outputName
    );

    const data = ffmpegInst.FS('readFile', outputName);
    f.blob = new Blob([data.buffer], { type: 'audio/mpeg' });
    f.status = 'done';
    f.progress = 100;

    // Cleanup MEMFS
    try { ffmpegInst.FS('unlink', inputName); } catch {}
    try { ffmpegInst.FS('unlink', outputName); } catch {}
  } catch (err) {
    console.error('Convert error:', err);
    f.status = 'error';
  }

  renderList();
}

async function retryFile(id) {
  const f = files.find(x => x.id === id);
  if (!f || activeConvert) return;
  if (!ffmpegReady) { showToast('⏳ FFmpeg aún cargando'); return; }
  activeConvert = true;
  document.getElementById('btn-convert-all').disabled = true;
  await convertFile(f);
  updateSummary();
  activeConvert = false;
  document.getElementById('btn-convert-all').disabled = false;
}

// ── Download ──────────────────────────────────────────────────────────────────
function downloadFile(id) {
  const f = files.find(x => x.id === id);
  if (!f?.blob) return;
  const url = URL.createObjectURL(f.blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = f.baseName + '.mp3';  // original name, .mp3 extension
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

async function downloadAll() {
  const done = files.filter(f => f.status === 'done' && f.blob);
  if (!done.length) { showToast('⚠️ No hay archivos convertidos aún'); return; }

  const btn = document.getElementById('btn-download-all');
  btn.disabled = true;
  btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Creando ZIP…';

  try {
    const zip = new JSZip();
    for (const f of done) {
      zip.file(f.baseName + '.mp3', f.blob);
    }
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mp3-convertidos.zip';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    showToast('✅ ZIP descargado con ' + done.length + ' archivos');
  } catch (e) {
    showToast('⚠️ Error creando ZIP: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Descargar todo (ZIP)';
    updateSummary();
  }
}

// ── Remove / Clear ────────────────────────────────────────────────────────────
function removeFile(id) {
  files = files.filter(f => f.id !== id);
  renderList();
  updateSummary();
  hideActions();
}

function clearAll() {
  if (activeConvert) { showToast('⚠️ Espera a que termine la conversión'); return; }
  files = [];
  renderList();
  updateSummary();
  hideActions();
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, dur = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), dur);
}

// ── Server upload ─────────────────────────────────────────────────────────────
async function uploadFile(id) {
  const f = files.find(x => x.id === id);
  if (!f?.blob || f.uploading) return;
  f.uploading = true;
  renderList();
  try {
    const filename = encodeURIComponent(f.baseName + '.mp3');
    const r = await fetch('/api/sounds/upload?name=' + filename, {
      method: 'POST',
      body: f.blob,
      headers: { 'Content-Type': 'audio/mpeg' },
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Upload error');
    f.uploadUrl = data.url;
    showToast('✅ Subido — URL copiada al portapapeles');
    copyUrl(location.origin + data.url);
  } catch (e) {
    showToast('⚠️ Error al subir: ' + e.message);
  } finally {
    f.uploading = false;
    renderList();
    updateSummary();
  }
}

async function uploadAll() {
  const pending = files.filter(f => f.status === 'done' && f.blob && !f.uploadUrl);
  if (!pending.length) { showToast('✅ Todos ya están en el servidor'); return; }
  const btn = document.getElementById('btn-upload-all');
  btn.disabled = true;
  for (const f of pending) await uploadFile(f.id);
  btn.disabled = files.filter(f => f.status === 'done').length === 0;
  showToast('✅ ' + pending.length + ' archivo' + (pending.length !== 1 ? 's' : '') + ' subido' + (pending.length !== 1 ? 's' : '') + ' al servidor');
}

function copyUrl(url) {
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(url).then(() => showToast('📋 URL copiada')).catch(() => fallbackCopy(url));
  } else {
    fallbackCopy(url);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showToast('📋 URL copiada'); } catch {}
  document.body.removeChild(ta);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
initFFmpeg();
</script>
